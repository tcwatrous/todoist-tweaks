<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#202020; --muted:#777; --line:#e6e6e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1f1f; --fg:#eee; --muted:#999; --line:#333; }
  }
  body { margin:0; width:290px; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { padding:14px; display:grid; gap:12px; }
  h1 { font-size:14px; margin:0; display:flex; justify-content:space-between; align-items:center; }
  .row { display:flex; gap:8px; align-items:center; }
  input[type=color] { width:44px; height:32px; border:1px solid var(--line); border-radius:6px; padding:2px; background:none; cursor:pointer; }
  input[type=text] { flex:1; height:30px; border:1px solid var(--line); border-radius:6px; padding:0 8px; background:transparent; color:inherit; font:inherit; font-family:ui-monospace, monospace; }
  .swatches { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
  .swatches button { aspect-ratio:1; border:0; border-radius:50%; cursor:pointer; outline-offset:2px; }
  .swatches button.on { outline:2px solid var(--fg); }
  .muted { color:var(--muted); font-size:12px; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  details .row { margin-top:8px; }
  button.plain { height:30px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; cursor:pointer; padding:0 10px; font:inherit; }
  .switch { position:relative; width:34px; height:20px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; border-radius:20px; background:var(--line); transition:.15s; cursor:pointer; }
  .switch span::after { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.15s; }
  .switch input:checked + span { background:var(--accent, #3b82f6); }
  .switch input:checked + span::after { transform:translateX(14px); }
  hr { border:0; border-top:1px solid var(--line); margin:2px 0; }
  .grp { font-size:11px; color:var(--muted); margin:2px 0 -6px; }
  .sounds { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .sounds button { height:30px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; cursor:pointer; font:inherit; font-size:12px; text-align:left; padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sounds button.on { border:2px solid var(--accent, #3b82f6); padding:0 7px; }
  input[type=range] { flex:1; accent-color:var(--accent, #3b82f6); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Accent color
    <label class="switch" title="On / off"><input id="enabled" type="checkbox"><span></span></label>
  </h1>
  <div class="row">
    <input id="picker" type="color">
    <input id="hex" type="text" maxlength="7" spellcheck="false">
  </div>
  <div class="swatches" id="swatches"></div>
  <div class="muted" id="status">Open a Todoist tab to see status.</div>
  <details>
    <summary>Advanced</summary>
    <div class="muted" style="margin-top:8px">If the wrong things recolor, enter the color Todoist is currently using as its accent.</div>
    <div class="row">
      <input id="source" type="text" placeholder="auto-detect" spellcheck="false">
      <button class="plain" id="rescan">Rescan</button>
    </div>
  </details>
  <hr>
  <h1>White tab icon
    <label class="switch" title="On / off"><input id="whiteIcon" type="checkbox"><span></span></label>
  </h1>
  <hr>
  <h1>Complete sound</h1>
  <div id="soundList" style="display:grid; gap:12px"></div>
  <div class="row">
    <span class="muted">Volume</span>
    <input id="volume" type="range" min="0" max="100" step="1">
  </div>
</div>
<script src="sounds.js"></script>
<script src="popup.js"></script>
</body>
</html>
